name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy cdat-website
    runs-on: [self-hosted, Linux, X64, cdat-website]
    timeout-minutes: 20
    environment: production

    env:
      APP_DIR: /opt/docker/apps/cdat-website

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build container
        env:
          PUBLIC_GSC_VERIFICATION: ${{ secrets.GSC_VERIFICATION }}
        run: docker compose build cdat-website

      - name: Sync compose to APP_DIR
        run: |
          set -euo pipefail
          install -d "$APP_DIR"
          install -m 0644 docker-compose.yml "$APP_DIR/docker-compose.yml"

      - name: Deploy via docker compose
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          docker compose up -d --force-recreate

      - name: Smoke test container internal :8092
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null --max-time 5 http://127.0.0.1:8092/; then
              echo "container healthy after ${i} attempt(s)"
              break
            fi
            sleep 2
            if [ "$i" = "30" ]; then
              echo "::error::cdat-website container did not become healthy in 60s"
              docker logs cdat-website --tail 100 || true
              exit 1
            fi
          done

      - name: Smoke test /mcp tools/list
        run: |
          set -euo pipefail
          response=$(curl -sf --max-time 10 \
            -X POST http://127.0.0.1:8092/mcp \
            -H "content-type: application/json" \
            -H "accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          echo "$response" | grep -q '"name":"list_docs"' || { echo "::error::MCP tools/list missing list_docs"; exit 1; }
          echo "MCP tools/list OK"

      - name: Smoke test public HTTPS via Cloudflare
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sfI --max-time 10 https://cdat.sdet.it > /dev/null; then
              echo "public HTTPS healthy after ${i} attempt(s)"
              break
            fi
            sleep 5
            if [ "$i" = "12" ]; then
              echo "::warning::public HTTPS not reachable in 60s"
            fi
          done

      - name: Prune old images
        if: success()
        run: docker image prune -f --filter "until=168h"

      - name: Notify Discord
        if: always()
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP: cdat-website
          STATUS: ${{ job.status }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD webhook URL empty - skipping notification"
            exit 0
          fi

          case "${STATUS,,}" in
            success)   ICON="✅"; LABEL="OK" ;;
            failure)   ICON="❌"; LABEL="FAILED" ;;
            cancelled) ICON="⚠️"; LABEL="CANCELLED" ;;
            *)         ICON="ℹ️"; LABEL="${STATUS^^}" ;;
          esac

          COMMIT_MSG=""
          if [ -d .git ]; then
            COMMIT_MSG="$(git log -1 --pretty=%s 2>/dev/null || true)"
          fi

          SHORT_SHA="${SHA:0:7}"
          BODY="${ICON} **${APP} deploy ${LABEL}** - \`${REF}@${SHORT_SHA}\`"
          if [ -n "${COMMIT_MSG}" ]; then
            BODY="${BODY} - ${COMMIT_MSG}"
          fi
          if [ "${STATUS,,}" = "failure" ]; then
            BODY="${BODY} - <${RUN_URL}>"
          fi

          PAYLOAD=$(jq -n --arg c "${BODY}" '{content: $c}')

          if [ "${STATUS,,}" = "failure" ]; then
            curl -fsS -X POST -H "Content-Type: application/json" \
              -d "${PAYLOAD}" "${WEBHOOK_URL}" >/dev/null || true
          else
            curl -fsS -X POST -H "Content-Type: application/json" \
              -d "${PAYLOAD}" "${WEBHOOK_URL}" >/dev/null
          fi
